name: Deploy Eureka to Minikube

on:
  push:
    branches: [ kubernates-deployment-fix ]
  workflow_dispatch:

env:
  SERVICE_DIR: eureka-server
  IMAGE_TAG: eureka-service:latest              # must match Deployment
  DEPLOY_DIR: eureka-server/k8s                 # where the YAMLs live

concurrency:
  group: eureka-deploy
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: self-hosted

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Ensure Minikube (Docker driver) is running
        shell: bash
        run: |
          set -euxo pipefail
          docker info >/dev/null
          minikube status || minikube start --driver=docker
          kubectl config use-context minikube
          minikube status

      - name: Build fat JAR
        shell: bash
        run: |
          set -euxo pipefail
          cd "$SERVICE_DIR"
          mvn -q -DskipTests clean package

      - name: Build image into Minikube
        shell: bash
        run: |
          set -euxo pipefail
          # Build using the Dockerfile inside the service dir
          minikube image build -t "$IMAGE_TAG" -f "$SERVICE_DIR/Dockerfile" "$SERVICE_DIR"
          # Prove it's there
          minikube image ls | grep "${IMAGE_TAG%%:*}" || true

      - name: Apply manifests
        shell: bash
        run: |
          set -euxo pipefail
          kubectl apply -f "$DEPLOY_DIR/eureka-deployment.yml"
          kubectl apply -f "$DEPLOY_DIR/eureka-service.yml"
          kubectl rollout status deploy/eureka-deployment --timeout=180s

      - name: Post-deploy checks
        if: always()
        shell: bash
        run: |
          kubectl get pods -o wide
          kubectl get svc -o wide
          kubectl get events --sort-by=.lastTimestamp | tail -n 25