name: Deploy Eureka to Minikube

on:
  push:
    branches: [ main, kubernates-deployment-fix ]
    paths:
      - 'eureka-server/**'
      - '.github/workflows/eureka-service-ci-cd.yml'
      - 'shared/**'
  workflow_dispatch:

env:
  SERVICE_DIR: eureka-server
  IMAGE_TAG: eureka-service:latest
  DEPLOY_DIR: eureka-server/k8s

concurrency:
  group: eureka-deploy
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: self-hosted

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Ensure Minikube (Docker driver) is running
        run: |
          set -euxo pipefail
          docker info >/dev/null
          minikube status || minikube start --driver=docker
          kubectl config use-context minikube
          minikube status

      - name: Build fat JAR
        run: |
          set -euxo pipefail
          cd "$SERVICE_DIR"
          mvn -q -DskipTests clean package

      - name: Build image into Minikube
        run: |
          set -euxo pipefail
          eval $(minikube docker-env)
          docker build -t "$IMAGE_TAG" "$SERVICE_DIR"
          docker images | grep "${IMAGE_TAG%%:*}" || true

      - name: Apply Kubernetes manifests
        run: |
          set -euxo pipefail
          kubectl apply -f "$DEPLOY_DIR"
          kubectl rollout status deploy/eureka-deployment --timeout=180s || {
            echo "Rollout failed. Fetching logs..."
            kubectl logs -l app=eureka-server --tail=50
            exit 1
          }

      - name: Post-deploy checks
        if: always()
        run: |
          kubectl get pods -o wide
          kubectl get svc -o wide
          kubectl get events --sort-by=.lastTimestamp | tail -n 20
