name: Deploy Eureka to Minikube

on:
  push:
    branches: [ main, kubernates-deployment-fix ]
    paths:
      - 'eureka-server/**'
      - '.github/workflows/eureka-service-ci-cd.yml'
      - 'shared/**'
  workflow_dispatch:

env:
  SERVICE_DIR: eureka-server
  IMAGE_TAG: eureka-service:latest
  DEPLOY_DIR: eureka-server/k8s

concurrency:
  group: eureka-deploy
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: self-hosted

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Ensure Minikube is running (robust)
        shell: bash
        run: |
          set -euxo pipefail
          
          # Function to verify Minikube is truly working
          verify_minikube() {
            minikube status >/dev/null 2>&1 && \
            kubectl config use-context minikube >/dev/null 2>&1 && \
            kubectl cluster-info >/dev/null 2>&1
          }
          
          echo "🔍 Checking Minikube status..."
          
          if verify_minikube; then
            echo "✅ Minikube is running and accessible"
          else
            echo "❌ Minikube is not accessible, attempting recovery..."
          
            # Try to stop any hanging processes
            minikube stop || true
            sleep 5
          
            # Start Minikube with proper settings
            echo "🚀 Starting Minikube..."
            minikube start \
              --driver=docker \
              --memory=4096 \
              --cpus=2 \
              --disk-size=20g \
              --wait=true \
              --timeout=10m
          
            # Wait a bit for full initialization
            sleep 15
          
            # Verify it's working
            if verify_minikube; then
              echo "✅ Minikube recovery successful"
            else
              echo "❌ Minikube recovery failed"
              minikube logs || true
              exit 1
            fi
          fi
          
          # Set context and verify kubectl works
          kubectl config use-context minikube
          kubectl get nodes
          echo "🎉 Minikube is ready!"

      - name: Configure Docker environment
        shell: bash
        run: |
          set -euxo pipefail
          eval $(minikube docker-env)
          echo "DOCKER_HOST=$DOCKER_HOST" >> $GITHUB_ENV
          echo "DOCKER_TLS_VERIFY=$DOCKER_TLS_VERIFY" >> $GITHUB_ENV
          echo "DOCKER_CERT_PATH=$DOCKER_CERT_PATH" >> $GITHUB_ENV

      - name: Setup Java (cached)
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Cache Maven dependencies (improved)
        uses: actions/cache@v4
        with:
          path: |
            ~/.m2/repository
            ~/.m2/wrapper
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml', '**/maven-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Build fat JAR (optimized)
        shell: bash
        run: |
          set -euxo pipefail
          cd "$SERVICE_DIR"
          mvn clean package -DskipTests -T 1C --batch-mode --no-transfer-progress \
            -Dmaven.javadoc.skip=true -Dmaven.source.skip=true

      - name: Build Docker image (with cache)
        shell: bash
        env:
          DOCKER_BUILDKIT: 1
        run: |
          set -euxo pipefail
          docker build \
            --cache-from "$IMAGE_TAG" \
            --build-arg BUILDKIT_INLINE_CACHE=1 \
            -t "$IMAGE_TAG" \
            "$SERVICE_DIR"

      - name: Deploy to Kubernetes (optimized)
        shell: bash
        run: |
          set -euxo pipefail
          kubectl apply -f "$DEPLOY_DIR"
          if kubectl get deployment eureka-deployment >/dev/null 2>&1; then
            kubectl rollout restart deployment/eureka-deployment
          fi
          kubectl rollout status deployment/eureka-deployment --timeout=120s

      - name: Quick health check
        shell: bash
        run: |
          set -euxo pipefail
          kubectl wait --for=condition=ready pod -l app=eureka-service --timeout=180s
          NODE_PORT=$(kubectl get svc eureka-service -o jsonpath='{.spec.ports[0].nodePort}')
          SERVICE_IP=$(kubectl get nodes -o jsonpath='{.items[0].status.addresses[?(@.type=="InternalIP")].address}')
          SERVICE_URL="http://${SERVICE_IP}:${NODE_PORT}"
          echo "Service URL: $SERVICE_URL"
          curl --fail "${SERVICE_URL}/actuator/health"

      - name: Post-deploy info (on failure only)
        if: failure()
        shell: bash
        run: |
          echo "=== PODS ==="
          kubectl get pods -o wide
          echo "=== SERVICES ==="
          kubectl get svc -o wide
          echo "=== RECENT EVENTS ==="
          kubectl get events --sort-by=.lastTimestamp | tail -n 10
          echo "=== EUREKA LOGS ==="
          kubectl logs -l app=eureka-service --tail=30
