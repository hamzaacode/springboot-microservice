name: Deploy Eureka to Minikube

on:
  push:
    branches: [ main, kubernates-deployment-fix ]
    paths:
      - 'eureka-server/**'
      - '.github/workflows/eureka-service-ci-cd.yml'
      - 'shared/**'
  workflow_dispatch:

env:
  SERVICE_DIR: eureka-server
  IMAGE_TAG: eureka-service:latest
  DEPLOY_DIR: eureka-server/k8s

concurrency:
  group: eureka-deploy
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: self-hosted

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Ensure Minikube (Docker driver) is running
        shell: bash
        run: |
          set -euxo pipefail
          docker info >/dev/null
          minikube status || minikube start --driver=docker
          kubectl config use-context minikube
          minikube status

      - name: Configure Docker to use Minikube's environment
        shell: bash
        run: |
          set -euxo pipefail
          eval $(minikube docker-env)

      - name: Cache Maven dependencies
        uses: actions/cache@v3
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Build fat JAR
        shell: bash
        run: |
          set -euxo pipefail
          cd "$SERVICE_DIR"
          mvn clean package -DskipTests

      - name: Build Docker image into Minikube
        shell: bash
        run: |
          set -euxo pipefail
          docker build -t "$IMAGE_TAG" "$SERVICE_DIR"
          docker images | grep "${IMAGE_TAG%%:*}" || true

      - name: Apply Kubernetes manifests
        shell: bash
        run: |
          set -euxo pipefail
          kubectl apply -f "$DEPLOY_DIR"
          kubectl rollout status deploy/eureka-deployment --timeout=180s || {
            echo "Rollout failed. Fetching logs..."
            kubectl logs -l app=eureka-service --tail=50
            exit 1
          }

      - name: Post-deploy checks
        if: always()
        shell: bash
        run: |
          kubectl get pods -o wide
          kubectl get svc -o wide
          kubectl get events --sort-by=.lastTimestamp | tail -n 20

      - name: Show Eureka Service URL
        if: always()
        shell: bash
        run: |
          minikube service eureka-service --url || true

      - name: Show recent Eureka logs
        if: always()
        shell: bash
        run: |
          kubectl logs -l app=eureka-service --tail=50