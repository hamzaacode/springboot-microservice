name: Deploy Eureka to Minikube

on:
  push:
    branches:
      - kubernates-deployment-fix
  workflow_dispatch:

concurrency:
  group: eureka-deploy
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: self-hosted

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Ensure Minikube (Docker driver) is running
        shell: bash
        run: |
          set -euxo pipefail
          docker info >/dev/null
          minikube status || minikube start --driver=docker
          kubectl config use-context minikube
          minikube status

      - name: Build JAR
        shell: bash
        run: |
          set -euxo pipefail
          cd eureka-service
          mvn -q -DskipTests clean package

      # Build the image directly into Minikube’s Docker daemon
      - name: Build image into Minikube
        shell: bash
        run: |
          set -euxo pipefail
          # IMPORTANT: tag matches Deployment's image
          minikube image build -t eureka-service:latest eureka-service

      - name: Apply manifests
        shell: bash
        run: |
          set -euxo pipefail
          kubectl apply -f eureka-service/eureka-deployment.yml
          kubectl apply -f eureka-service/eureka-service.yml
          kubectl rollout status deploy/eureka-deployment --timeout=180s

      - name: Post-deploy checks
        if: always()
        shell: bash
        run: |
          kubectl get pods,svc
          kubectl get events --sort-by=.lastTimestamp | tail -n 20