name: Deploy Order Service to Minikube

on:
  push:
    branches: [ kubernates-deployment-fix ]
    paths:
      - 'order-service/**'
      - '.github/workflows/order-service-ci-cd.yml'
  workflow_dispatch:

env:
  SERVICE_DIR: order-service
  IMAGE_BASE: order-service
  DEPLOY_DIR: order-service/k8s

concurrency:
  group: order-deploy
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: self-hosted

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Ensure Minikube (Docker driver) is running
        shell: bash
        run: |
          set -euxo pipefail
          docker info >/dev/null
          minikube status || minikube start --driver=docker
          kubectl config use-context minikube

      - name: Build fat JAR
        shell: bash
        run: |
          set -euxo pipefail
          cd "$SERVICE_DIR"
          mvn -q -DskipTests clean package

      - name: Build image into Minikube
        shell: bash
        run: |
          set -euxo pipefail
          TAG="${GITHUB_SHA}"
          minikube image build \
            -t "${IMAGE_BASE}:${TAG}" \
            -t "${IMAGE_BASE}:latest" \
            -f "${SERVICE_DIR}/Dockerfile" "${SERVICE_DIR}"

          # make sure the node actually has the image
          minikube image load "${IMAGE_BASE}:${TAG}"

          # sanity checks
          echo "== images seen by minikube =="
          minikube image ls | grep "${IMAGE_BASE}" || true
          echo "== images on node via crictl =="
          minikube ssh -- sudo crictl images | grep "${IMAGE_BASE}" || true

      - name: Apply manifests and rollout
        shell: bash
        run: |
          set -euxo pipefail
          TAG="${GITHUB_SHA}"

          kubectl apply -f "${SERVICE_DIR}/k8s/order-deployment.yml"
          kubectl apply -f "${SERVICE_DIR}/k8s/order-service.yml"

          # point deployment at the freshly built image
          kubectl set image deployment/order-deployment \
            order-service="${IMAGE_BASE}:${TAG}"

          echo "Pods before rollout:"
          kubectl get pods -l app=order-service -o wide || true

          kubectl rollout status deploy/order-deployment --timeout=300s || {
            echo "=== DEPLOYMENT ==="; kubectl describe deploy/order-deployment
            echo "=== REPLICASETS ==="; kubectl get rs -l app=order-service -o wide
            echo "=== PODS ==="; kubectl get pods -l app=order-service -o wide
            POD=$(kubectl get pods -l app=order-service --sort-by=.metadata.creationTimestamp -o jsonpath='{.items[-1:].0.metadata.name}' || true)
            if [ -n "${POD}" ]; then
              echo "=== DESCRIBE POD ${POD} ==="; kubectl describe pod "${POD}"
              echo "=== LOGS ${POD} (tail) ==="; kubectl logs "${POD}" --tail=200 || true
            fi
            exit 1
          }

      - name: Post-deploy checks
        if: always()
        shell: bash
        run: |
          kubectl get pods -o wide
          kubectl get svc -o wide