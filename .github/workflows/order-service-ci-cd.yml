name: Deploy Order Service to Minikube

on:
  push:
    branches: [ kubernates-deployment-fix ]
    paths:
      - 'order-service/**'
      - '.github/workflows/order-service-ci-cd.yml'
      - 'shared/**'            # only if edits here should redeploy order
  workflow_dispatch:

env:
  SERVICE_DIR: order-service
  IMAGE_TAG: order-service:latest
  DEPLOY_DIR: order-service

concurrency:
  group: order-deploy
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: self-hosted

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Ensure Minikube (Docker driver) is running
        shell: bash
        run: |
          set -euxo pipefail
          docker info >/dev/null
          minikube status || minikube start --driver=docker
          kubectl config use-context minikube
          minikube status

      - name: Build fat JAR
        shell: bash
        run: |
          set -euxo pipefail
          cd "$SERVICE_DIR"
          mvn -q -DskipTests clean package

      - name: Build image into Minikube
        shell: bash
        run: |
          set -euxo pipefail
          minikube image build -t "$IMAGE_TAG" -f "$SERVICE_DIR/Dockerfile" "$SERVICE_DIR"

      - name: Apply manifests
        shell: bash
        run: |
          set -euxo pipefail
          kubectl apply -f "$DEPLOY_DIR/order-deployment.yml"
          kubectl apply -f "$DEPLOY_DIR/order-service.yml"
          kubectl rollout status deploy/order-deployment --timeout=180s

      - name: Post-deploy checks
        if: always()
        shell: bash
        run: |
          kubectl get pods -o wide
          kubectl get svc -o wide
          kubectl get events --sort-by=.lastTimestamp | tail -n 25