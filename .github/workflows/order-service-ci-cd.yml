name: Deploy Order Service (Pre-built Image)

on:
  push:
    branches: [ main, kubernates-deployment-fix ]
    paths:
      - 'order-service/k8s/**'
      - '.github/workflows/order-service-ci-cd.yml'
  workflow_dispatch:
    inputs:
      force_rebuild:
        description: 'Force rebuild Docker image'
        required: false
        default: false
        type: boolean

env:
  SERVICE_DIR: order-service
  IMAGE_TAG: order-service:latest
  DEPLOY_DIR: order-service/k8s

concurrency:
  group: order-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Ensure Minikube is running
        shell: bash
        run: |
          set -euxo pipefail
          if minikube status >/dev/null 2>&1; then
            echo "Minikube already running"
            kubectl config use-context minikube
          else
            echo "Starting Minikube..."
            minikube start --driver=docker --memory=2048 --cpus=2
            kubectl config use-context minikube
          fi

      - name: Configure Docker environment
        shell: bash
        run: |
          set -euxo pipefail
          eval $(minikube docker-env)
          echo "DOCKER_HOST=$DOCKER_HOST" >> $GITHUB_ENV
          echo "DOCKER_TLS_VERIFY=$DOCKER_TLS_VERIFY" >> $GITHUB_ENV
          echo "DOCKER_CERT_PATH=$DOCKER_CERT_PATH" >> $GITHUB_ENV

      - name: Check if image exists
        id: check_image
        shell: bash
        run: |
          set -euxo pipefail
          if docker image inspect "$IMAGE_TAG" >/dev/null 2>&1; then
            echo "exists=true" >> $GITHUB_OUTPUT
            IMAGE_DATE=$(docker image inspect "$IMAGE_TAG" --format '{{.Created}}')
            echo "Image found: $IMAGE_DATE"
          else
            echo "exists=false" >> $GITHUB_OUTPUT
            echo "❌ Image $IMAGE_TAG not found in Minikube!"
            echo "Please build the image locally first using:"
            echo "  ./build-local.sh"
            echo "Or enable force_rebuild in workflow dispatch"
          fi

      - name: Build image if missing (optional)
        if: steps.check_image.outputs.exists == 'false' && github.event.inputs.force_rebuild == 'true'
        shell: bash
        run: |
          set -euxo pipefail
          echo "🔨 Building image as requested..."
          
          # Setup Java
          java -version || (echo "Java not found, installing..." && sudo apt-get update && sudo apt-get install -y openjdk-17-jdk)
          
          # Build locally then copy to Minikube
          cd "$SERVICE_DIR"
          mvn clean package -DskipTests -T 1C --batch-mode --no-transfer-progress
          docker build -t "$IMAGE_TAG" .
          
          echo "✅ Image built successfully"

      - name: Fail if no image available
        if: steps.check_image.outputs.exists == 'false' && github.event.inputs.force_rebuild != 'true'
        shell: bash
        run: |
          echo "❌ No Docker image available and rebuild not requested"
          echo ""
          echo "To fix this, either:"
          echo "1. Build locally: ./build-local.sh"
          echo "2. Run workflow with 'force_rebuild' enabled"
          echo "3. Use the full build workflow instead"
          exit 1

      - name: Deploy to Kubernetes
        shell: bash
        run: |
          set -euxo pipefail
          
          echo "🚀 Deploying with existing image..."
          kubectl apply -f "$DEPLOY_DIR"
          
          # Smart deployment strategy
          if kubectl get deployment order-deployment >/dev/null 2>&1; then
            kubectl rollout restart deployment/order-deployment
            kubectl rollout status deployment/order-deployment --timeout=120s
          fi

      - name: Health check and service info
        shell: bash
        run: |
          set -euxo pipefail
          
          # Wait for pods to be ready
          kubectl wait --for=condition=ready pod -l app=order-service --timeout=60s
          
          echo "✅ Deployment successful!"
          echo "🌐 Service URL: $(minikube service order-service --url 2>/dev/null || echo 'Not available')"
          echo "📋 Pod status:"
          kubectl get pods -l app=order-service -o wide

      - name: Show logs on failure
        if: failure()
        shell: bash
        run: |
          echo "=== DEPLOYMENT LOGS ==="
          kubectl logs -l app=order-service --tail=30 --timestamps