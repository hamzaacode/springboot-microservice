apiVersion: v1
kind: Service
metadata:
  name: eureka-service
  labels:
    app: eureka-service
    component: discovery
spec:
  type: ClusterIP  # Changed from NodePort for internal communication
  selector:
    app: eureka-service
  ports:
    - name: http
      port: 8761
      targetPort: 8761
      protocol: TCP
